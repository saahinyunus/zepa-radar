# NOTE: this repository is meant to be PUBLIC. Public repos get unlimited free
# Actions minutes, so the 20-minute schedule fits. Never commit secrets: every key
# lives in Settings -> Secrets and variables -> Actions. Logs are public as well,
# and main.py logs only counts and item IDs, never lead content or tokens.
# GitHub disables scheduled workflows after 60 days without repository activity;
# re-enable it from the Actions tab (or push any commit) if that happens.
name: Lead Radar Cron

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

# Never let two cycles overlap (would double-send leads).
concurrency:
  group: radar-cron
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cron.txt

      - name: Install dependencies
        run: pip install -r requirements-cron.txt

      - name: Run radar cycle
        env:
          EXECUTION_MODE: TELEGRAM_SAAS
          # Paused until the LIVE Lemon Squeezy checkout link is configured; then set to "true".
          FREE_CHANNEL_ENABLED: "false"
          PYTHONUNBUFFERED: "1"
          PYTHONUTF8: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GROQ_FALLBACK_MODEL: ${{ secrets.GROQ_FALLBACK_MODEL }}
          GROQ_TRIAGE_MODEL: ${{ secrets.GROQ_TRIAGE_MODEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_VIP_GROUP_ID: ${{ secrets.TELEGRAM_VIP_GROUP_ID }}
          TELEGRAM_FREE_CHANNEL_ID: ${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}
          TOPIC_ID_SOFTWARE: ${{ secrets.TOPIC_ID_SOFTWARE }}
          TOPIC_ID_DESIGN: ${{ secrets.TOPIC_ID_DESIGN }}
          TOPIC_ID_VIDEO: ${{ secrets.TOPIC_ID_VIDEO }}
          TOPIC_ID_MARKETING: ${{ secrets.TOPIC_ID_MARKETING }}
          LEMON_SQUEEZY_CHECKOUT_URL: ${{ secrets.LEMON_SQUEEZY_CHECKOUT_URL }}
        run: python main.py
