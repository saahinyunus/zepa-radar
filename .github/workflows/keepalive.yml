# Render's free tier puts the webhook service to sleep after ~15 minutes without traffic, and the
# first request then takes ~30 s (a customer waiting for their VIP invite link would notice).
# This pings /health so the service stays awake. GitHub's scheduler can drift by several minutes,
# so an external monitor (e.g. UptimeRobot, 5-minute interval) is the more reliable option;
# use either or both. Set the repository secret RENDER_HEALTH_URL to
# https://<your-service>.onrender.com/health - without it this job does nothing.
name: Keep Webhook Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: true

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::notice::RENDER_HEALTH_URL is not set - nothing to ping"
            exit 0
          fi
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 "$HEALTH_URL" > /dev/null
          echo "Webhook service answered"
